# ========================
# PRODUCTION
# ========================

# \u2705 Nginx \uD504\uB85D\uC2DC \uD658\uACBD\uC5D0\uC11C https \uC778\uC2DD
server.forward-headers-strategy=framework

# ========================
# JWT
# ========================
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=goodsugar
app.jwt.access-minutes=15
app.jwt.refresh-days=14

# ========================
# OAuth2 Redirect URI (Google)
# ========================
spring.security.oauth2.client.registration.google.redirect-uri=https://api.goodsugar.store/login/oauth2/code/google

# OAuth \uB85C\uADF8\uC778 \uC131\uACF5 \uD6C4 \uD504\uB860\uD2B8\uB85C \uBCF4\uB0B4\uB294 \uC8FC\uC18C(\uB108 \uD504\uB85C\uC81D\uD2B8 \uAC12 \uC720\uC9C0)
app.oauth2.frontend-redirect=https://www.goodsugar.store/oauth/callback

# ========================
# CORS (\uD504\uB860\uD2B8 \uB3C4\uBA54\uC778\uB9CC \uD5C8\uC6A9)
# ========================
app.cors.allowed-origins=https://goodsugar.store,https://www.goodsugar.store

# ========================
# Cookie \uC815\uCC45 (Refresh Token)
# \uB124 \uCF54\uB4DC\uC5D0\uC11C \uCFE0\uD0A4 \uC0DD\uC131 \uC2DC Domain/SameSite/Secure \uC124\uC815\uC5D0 \uCC38\uACE0
# ========================
app.cookie.domain=.goodsugar.store
app.cookie.secure=true
app.cookie.same-site=None