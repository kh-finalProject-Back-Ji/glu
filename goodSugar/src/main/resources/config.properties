# (참고)
# 1MB = 1024KB
# 1KB = 1024B

# 파일을 디스크에 쓸 때까지의 임계 값
# 기본 값 : 0B
# 50MB로 변경 == 52,428,800 B
# -> 업로드되는 파일의 크기 50MB 까지는 메모리에 임시로 저장하다가
# 초과 시 디스크(HDD, SSD)에 저장
spring.servlet.multipart.file-size-threshold=52428800

# 임계 값 초과 시 파일의 임시 저장 경로
# 마지막에 / 꼭 작성해줘야 함
spring.servlet.multipart.location=C:/uploadFiles/temp/

# HTTP 요청당 최대 크기
# 기본 값 : 10MB
# 50MB 로 변경
spring.servlet.multipart.max-request-size=52428800

# 개별 파일당 최대 크기
# 기본 값 : 1MB
# 10MB 로 변경
spring.servlet.multipart.max-file-size=10485760

