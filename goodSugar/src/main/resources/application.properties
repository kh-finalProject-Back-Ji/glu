spring.application.name=goodsugar
server.port=12345

# config.properties 로드
spring.config.import=classpath:config.properties

# 🔥 개발할 때는 dev
spring.profiles.active=prod
# 배포 직전에는 위를 주석처리하고 아래 사용
# spring.profiles.active=prod

# DevTools
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false

# 로그
logging.level.edu.kh.goodsugar=debug

# 세션
server.servlet.session.tracking-modes=cookie

# MyBatis
mybatis.mapper-locations=classpath:/mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=edu.kh.goodsugar.common.mybatis
mybatis.configuration.jdbc-type-for-null=VARCHAR
