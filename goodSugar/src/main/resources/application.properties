spring.application.name=goodsugar
server.port=12345

# ✅ EC2 외부 config.properties 읽기 (GitHub에 config 없어도 됨)
spring.config.import=optional:file:/opt/goodsugar/config.properties

# ✅ prod 활성화는 파일에 박지 말고 "실행 옵션/systemd"로 지정 (운영 사고 방지)
# spring.profiles.active=prod

# 로그(필요시 info로 낮춰)
logging.level.edu.kh.goodsugar=debug

# 세션 추적 (URL에 jsessionid 안붙게)
server.servlet.session.tracking-modes=cookie

# MyBatis
mybatis.mapper-locations=classpath:/mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=edu.kh.goodsugar.common.mybatis
mybatis.configuration.jdbc-type-for-null=VARCHAR
